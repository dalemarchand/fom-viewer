name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest tag
        id: latest_tag
        run: |
          # Fetch all tags first (including dangling ones)
          git fetch --tags origin
          # Get ALL tags sorted by version, pick the latest
          LATEST=$(git tag -l "v*" | sort -V | tail -1)
          if [ -z "$LATEST" ]; then
            LATEST="v0.0.0"
          fi
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "semver=$LATEST" >> $GITHUB_OUTPUT

      - name: Calculate next version
        id: next_version
        run: |
          CURRENT="${{ steps.latest_tag.outputs.semver }}"
          CURRENT=${CURRENT#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          HIGHEST=$(printf '%s\n' "$PKG_VERSION" "$CURRENT" | sort -V | tail -1)
          if [ "$HIGHEST" = "$PKG_VERSION" ] && [ "$PKG_VERSION" != "$CURRENT" ]; then
            NEXT="v$PKG_VERSION"
          else
            IFS='.' read -r major minor patch <<< "$CURRENT"
            PATCH=$((patch + 1))
            NEXT="v$major.$minor.$PATCH"
          fi
          echo "version=$NEXT" >> $GITHUB_OUTPUT

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.next_version.outputs.version }}"
          VERSION=${VERSION#v}
          npm pkg set version=$VERSION
          npm install --package-lock-only

      - name: Commit and push version update via Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="version-bump-${{ steps.next_version.outputs.version }}"
          git checkout -b "$BRANCH_NAME"
          git add package.json package-lock.json
          git commit -m "Bump version to ${{ steps.next_version.outputs.version }} [skip ci]"
          git push origin "$BRANCH_NAME" --force
          PR_URL=$(gh pr list --head "$BRANCH_NAME" --json url --jq '.[0].url')
          if [ -z "$PR_URL" ] || [ "$PR_URL" = "null" ]; then
            PR_URL=$(gh pr create --title "Bump version to ${{ steps.next_version.outputs.version }} [skip ci]" --body "Automated version bump for release ${{ steps.next_version.outputs.version }}." --head "$BRANCH_NAME" --base main)
          fi
          gh pr merge "$PR_URL" --merge --delete-branch
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Create annotated tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.next_version.outputs.version }}" -m "Release ${{ steps.next_version.outputs.version }}"

      - name: Push tag
        run: git push origin "${{ steps.next_version.outputs.version }}"

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.next_version.outputs.version }}
          name: Release ${{ steps.next_version.outputs.version }}
          draft: false
          prerelease: false
          body: FOM Viewer Release
          files: dist/fom-viewer.html